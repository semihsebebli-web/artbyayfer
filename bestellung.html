<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<script src="/consent.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Original von Ayfer bestellen — handgefertigte abstrakte Malerei, Strukturpaste und Metallpigment.">
<title>Bestellübersicht — Ayfer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231D1D1F'/%3E%3Ctext x='50' y='68' font-size='60' text-anchor='middle' fill='%23A9782E' font-family='sans-serif'%3EA%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --white:#FFFFFF; --grey:#F5F5F7; --grey-2:#E8E8ED; --ink:#1D1D1F; --text-dim:#6E6E73;
    --accent:#A9782E; --line:rgba(0,0,0,0.08);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ background:var(--white); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  a{color:var(--accent); text-decoration:none;}
  a:hover{text-decoration:underline;}
  nav{
    position:sticky; top:0; z-index:50; display:flex; justify-content:space-between; align-items:center;
    padding:0 24px; height:52px; background:rgba(255,255,255,0.75); backdrop-filter:blur(20px);
    border-bottom:1px solid var(--line);
  }
  .nav-name{font-size:1rem; font-weight:600;}
  .nav-back{font-size:0.82rem; color:var(--text-dim);}
  main{max-width:640px; margin:0 auto; padding:70px 22px 120px;}
  h1{font-size:clamp(1.9rem,4.5vw,2.6rem); font-weight:700; letter-spacing:-0.02em; margin-bottom:8px;}
  .subhead{font-size:0.95rem; color:var(--text-dim); margin-bottom:44px;}

  .order-card{ background:var(--grey); border-radius:22px; padding:26px; display:flex; gap:22px; }
  .order-card img{width:140px; height:170px; object-fit:cover; border-radius:14px; flex-shrink:0;}
  .order-card .details{flex:1;}
  .order-card .title{font-size:1.25rem; font-weight:600; margin-bottom:4px;}
  .order-card .dim{font-size:0.85rem; color:var(--text-dim); margin-bottom:8px;}
  .order-card .med{font-size:0.82rem; color:var(--text-dim); line-height:1.5;}
  @media (max-width:480px){ .order-card{flex-direction:column;} .order-card img{width:100%; height:220px;} }

  .cost-table{ margin-top:30px; border-top:1px solid var(--line); padding-top:20px; }
  .cost-row{display:flex; justify-content:space-between; font-size:0.95rem; padding:8px 0; color:#3a3a3c;}
  .cost-row.total{font-size:1.15rem; font-weight:700; color:var(--ink); border-top:1px solid var(--line); margin-top:8px; padding-top:16px;}
  .vat-note{font-size:0.78rem; color:var(--text-dim); margin-top:6px;}

  .confirm-box{margin-top:36px; display:flex; flex-direction:column; gap:16px;}
  .confirm-item{display:flex; gap:12px; align-items:flex-start; font-size:0.9rem; color:#3a3a3c; line-height:1.5;}
  .confirm-item input{margin-top:3px; width:18px; height:18px; flex-shrink:0; accent-color:var(--ink);}

  .order-btn{
    display:block; width:100%; margin-top:34px; padding:17px; border-radius:999px; border:none;
    background:var(--ink); color:var(--white); font-size:1rem; font-weight:600; cursor:pointer;
    font-family:inherit; transition:background 0.25s;
  }
  .order-btn:disabled{background:var(--grey-2); color:var(--text-dim); cursor:not-allowed;}
  .order-btn:not(:disabled):hover{background:#000;}
  .paypal-note{text-align:center; font-size:0.8rem; color:var(--text-dim); margin-top:14px;}

  .empty-state{text-align:center; padding:60px 20px; color:var(--text-dim);}
  .empty-state a{color:var(--accent);}

  .ship-form{margin-top:40px; border-top:1px solid var(--line); padding-top:30px;}
  .ship-form h2{font-size:1.1rem; font-weight:600; margin-bottom:6px;}
  .ship-form .hint{font-size:0.82rem; color:var(--text-dim); margin-bottom:20px;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px;}
  .field-row.full{grid-template-columns:1fr;}
  @media (max-width:480px){ .field-row{grid-template-columns:1fr;} }
  .field-row label{display:flex; flex-direction:column; gap:6px; font-size:0.82rem; color:var(--text-dim);}
  .field-row input{
    padding:12px 14px; border-radius:10px; border:1px solid var(--line); background:var(--grey);
    font-size:0.95rem; font-family:inherit; color:var(--ink);
  }
  .field-row input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  .field-error{font-size:0.78rem; color:#B3261E; margin-top:10px; display:none;}

  footer{ padding:40px 22px; text-align:center; font-size:0.8rem; color:var(--text-dim); border-top:1px solid var(--line); margin-top:60px; }
  footer a{color:var(--text-dim);}
  footer .foot-links{display:flex; justify-content:center; gap:24px; margin-top:10px; flex-wrap:wrap;}
</style>
</head>
<body>

<nav>
  <div class="nav-name">Ayfer</div>
  <a class="nav-back" href="index.html#gallery">← Zurück zur Galerie</a>
</nav>

<main>
  <div id="content"></div>
</main>

<footer>
  <div>© 2026 Ayfer — Alle Werke urheberrechtlich geschützt</div>
  <div class="foot-links">
    <a href="index.html">Zur Startseite</a>
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
    <a href="widerruf.html">Widerrufsrecht</a>
    <a href="agb.html">AGB</a>
  </div>
</footer>

<script>


/* Vor Live-Schaltung ersetzen: echter PayPal.me-Nutzername oder PayPal-Business-Checkout */
const PAYPAL_ME = 'https://www.paypal.com/paypalme/artbyayfer';
/* Platzhalter-Versandkosten — bitte durch reale Pauschale ersetzen */
const SHIPPING_COST = 39;

function paypalLink(totalAmount){
  return `${PAYPAL_ME}/${Math.round(totalAmount)}EUR`;
}


let works = [];

fetch('content/works.json')
  .then(r => r.json())
  .then(data => { works = data.items || []; initOrder(); })
  .catch(err => { console.error('Werke konnten nicht geladen werden:', err); });

function initOrder(){
const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get('id'));
const work = works.find(w => w.id === id);
const content = document.getElementById('content');

if(!work){
  content.innerHTML = `
    <div class="empty-state">
      <p>Kein Werk ausgewählt.</p>
      <p style="margin-top:10px;"><a href="index.html#gallery">Zurück zur Galerie</a></p>
    </div>
  `;
} else if(work.status !== 'verfügbar'){
  const statusText = work.status === 'verkauft' ? 'bereits verkauft' : 'aktuell reserviert';
  content.innerHTML = `
    <div class="empty-state">
      <p><strong>${work.title}</strong> ist ${statusText} und kann derzeit nicht bestellt werden.</p>
      <p style="margin-top:10px;"><a href="index.html#gallery">Zurück zur Galerie</a></p>
    </div>
  `;
} else {
  const price = parseInt(work.buy.replace(/[^\d]/g, ''));
  const total = price + SHIPPING_COST;
  content.innerHTML = `
    <h1>Bestellübersicht</h1>
    <p class="subhead">Bitte prüfen Sie Ihre Auswahl, bevor Sie zur Zahlung über PayPal weitergeleitet werden.</p>

    <div class="order-card">
      <img src="${work.image}" alt="${work.title}">
      <div class="details">
        <div class="title">${work.title}</div>
        <div class="dim">${work.dim}</div>
        <div class="med">${work.med}</div>
      </div>
    </div>

    <div class="cost-table">
      <div class="cost-row"><span>Werk</span><span>${price.toLocaleString('de-DE')} €</span></div>
      <div class="cost-row"><span>Versand (versichert, DE/EU)</span><span>${SHIPPING_COST.toLocaleString('de-DE')} €</span></div>
      <div class="cost-row total"><span>Gesamtsumme</span><span>${total.toLocaleString('de-DE')} €</span></div>
      <div class="vat-note">[USt-Status ausstehend — Gewerbeanmeldung noch nicht erfolgt]</div>
    </div>

    <div class="ship-form">
      <h2>Lieferadresse</h2>
      <p class="hint">Wird zusammen mit der Bestellung per E-Mail an Ayfer übermittelt.</p>
      <div class="field-row">
        <label>Vorname
          <input type="text" id="fName" required>
        </label>
        <label>Nachname
          <input type="text" id="lName" required>
        </label>
      </div>
      <div class="field-row full">
        <label>Strasse und Hausnummer
          <input type="text" id="street" required>
        </label>
      </div>
      <div class="field-row">
        <label>PLZ
          <input type="text" id="zip" required>
        </label>
        <label>Ort
          <input type="text" id="city" required>
        </label>
      </div>
      <div class="field-row full">
        <label>Land
          <input type="text" id="country" value="Deutschland" required>
        </label>
      </div>
      <div class="field-row full">
        <label>E-Mail (für Rückfragen &amp; Rechnung)
          <input type="email" id="email" required>
        </label>
      </div>
      <p class="field-error" id="formError">Bitte alle Felder ausfüllen.</p>
    </div>

    <div class="confirm-box">
      <label class="confirm-item">
        <input type="checkbox" id="agbCheck">
        <span>Ich habe die <a href="agb.html" target="_blank">AGB</a> gelesen und akzeptiere sie.</span>
      </label>
      <label class="confirm-item">
        <input type="checkbox" id="widerrufCheck">
        <span>Ich habe die <a href="widerruf.html" target="_blank">Widerrufsbelehrung</a> zur Kenntnis genommen.</span>
      </label>
    </div>

    <button class="order-btn" id="orderBtn" disabled>Zahlungspflichtig bestellen</button>
    <p class="paypal-note">Sie werden zur sicheren Zahlung über PayPal weitergeleitet — inklusive Käuferschutz.</p>
  `;

  const agbCheck = document.getElementById('agbCheck');
  const widerrufCheck = document.getElementById('widerrufCheck');
  const orderBtn = document.getElementById('orderBtn');

  function updateBtn(){
    orderBtn.disabled = !(agbCheck.checked && widerrufCheck.checked);
  }
  agbCheck.addEventListener('change', updateBtn);
  widerrufCheck.addEventListener('change', updateBtn);

  orderBtn.addEventListener('click', function(){
    if(orderBtn.disabled) return;

    const fields = ['fName','lName','street','zip','city','country','email'];
    const values = {};
    let allFilled = true;
    fields.forEach(id => {
      const el = document.getElementById(id);
      values[id] = el.value.trim();
      if(!values[id]) allFilled = false;
    });

    if(!allFilled){
      document.getElementById('formError').style.display = 'block';
      return;
    }
    document.getElementById('formError').style.display = 'none';

    const subject = encodeURIComponent(`Neue Bestellung: ${work.title}`);
    const body = encodeURIComponent(
`Neue Bestellung über artbyayfer.de

Werk: ${work.title} (${work.dim})
Material: ${work.med}
Werkpreis: ${price.toLocaleString('de-DE')} €
Versand: ${SHIPPING_COST.toLocaleString('de-DE')} €
Gesamtsumme: ${total.toLocaleString('de-DE')} €

Lieferadresse:
${values.fName} ${values.lName}
${values.street}
${values.zip} ${values.city}
${values.country}

E-Mail des Käufers: ${values.email}

Hinweis: Bitte Zahlungseingang bei PayPal manuell mit dieser Bestellung abgleichen.`
    );

    /* Vor Live-Schaltung: Ziel-E-Mail-Adresse von Ayfer eintragen */
    window.location.href = `mailto:bestellung@artbyayfer.de?subject=${subject}&body=${body}`;

    setTimeout(function(){
  if (typeof gtag === 'function') {
    gtag('event', 'conversion', {
        'send_to': 'AW-17829287336/4T6WCMbi0-IcEKir1bVC',
        'value': total,
        'currency': 'EUR',
        'transaction_id': String(Date.now())
    });
  }
  window.location.href = paypalLink(total);
}, 800);
  });
}

}
</script>

</body>
</html>
