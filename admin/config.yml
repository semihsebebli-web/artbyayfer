backend:
  name: git-gateway
  branch: main

media_folder: "uploads"
public_folder: "/uploads"

locale: "de"

collections:
  - name: "werke"
    label: "Werke"
    label_singular: "Werk"
    files:
      - name: "werke_liste"
        label: "Alle Werke"
        file: "content/works.json"
        fields:
          - label: "Werke"
            name: "items"
            widget: "list"
            summary: "{{fields.title}} — {{fields.buy}} ({{fields.status}})"
            fields:
              - { label: "ID (nicht ändern, nur bei neuem Werk hochzählen)", name: "id", widget: "number", value_type: "int" }
              - { label: "Titel", name: "title", widget: "string" }
              - { label: "Foto", name: "image", widget: "image" }
              - { label: "Maße (z.B. 60 × 80 cm)", name: "dim", widget: "string" }
              - { label: "Material", name: "med", widget: "string" }
              - { label: "Preis (z.B. 2.900 €)", name: "buy", widget: "string" }
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["verfügbar", "reserviert", "verkauft"]
                default: "verfügbar"
